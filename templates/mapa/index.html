{% extends 'base.html' %}
{% load static %}

{% block title %}<title>Mapa-app</title>{% endblock %}

{% block extra_head %}
    <!-- Bootstrap 5 CSS e Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- API de Mapas: Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="{% static 'css/mapa.css' %}">
{% endblock %}

{% block content %}
    <!-- 2. Contenedor del Mapa -->
    <div id="map"></div>
{% endblock %}

{% block extra_js %}

    [[<script id="estaciones-data" type="application/json">{{ estaciones_json|safe }}</script>]]
    <script>
        const estaciones = JSON.parse(document.getElementById('estaciones-data').textContent);
    </script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="{% static 'js/mapa.js' %}"></script>

{% endblock %}
