{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>

    <!-- Bootstrap 5 CSS e Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- API de Mapas: Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="{% static 'css/mapa.css' %}">
</head>
<body>

    <!-- 1. Barra de Búsqueda de Lugares en Chile -->
    <div class="top-search-bar">
        <div class="search-box">
            <i class="bi bi-search text-muted"></i>
            <input type="text" id="inputBuscar" placeholder="Buscar comuna, ciudad o lugar en Chile y presiona Enter...">
        </div>
    </div>

    <!-- 2. Contenedor del Mapa -->
    <div id="map"></div>

    <!-- API de Mapas: Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="{% static 'js/mapa.js' %}"></script>
</body>
</html>
