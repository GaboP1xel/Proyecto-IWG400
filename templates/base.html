{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/normalize.css' %}">
    <title>{% block title %}{% endblock %}</title>

    {% block extra_head %}
    {% endblock %}
</head>

<body>
    <header class="header">

        <nav class="base-nav">

            <div class="nav-logo">
                <img src="{% static 'img/logo.png' %}" alt="Logo de Nombre-App">
            </div>

            <search class="nav-search-bar">
                <div class="nav-search-form">
                    <input class="nav-search-input" id="inputBuscar" type="text" placeholder="Buscar...">
                    <button class="nav-search-button" type="submit">
                        <img src="{% static 'img/nav-search-icon.svg' %}" alt="Buscar">
                    </button>
                </div>
            </search>

            <button class="nav-menu-toggle" aria-haspopup="true" aria-expanded="false">☰</button>

            <ul class="nav-menu" style="display: none;">
                <li><a>Inicio</a></li>
                <li><a>Acerca de</a></li>
                <li><a>Contacto</a></li>
            </ul>

        </nav>
        
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Nombre-App. Todos los derechos reservados.</p>
    </footer>
    
    <script src="{% static 'js/base.js' %}"></script>
    {% block extra_js %}
    {% endblock %}
</body>
</html>
